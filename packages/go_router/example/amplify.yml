version: 1.0
applications:
  - appRoot: packages/go_router/example
    backend:
      phases:
        preBuild:
          commands:
            - echo $PWD
            - cd ../../../../
            - echo "Installing Flutter SDK"
            - git clone https://github.com/flutter/flutter.git -b stable
            - export PATH="$PATH:$(pwd)/flutter/bin"
            - flutter config --no-analytics
            - echo "Installing Very Good CLI"
            - dart pub global activate very_good_cli
            - echo "Installing dependencies"
            - echo $PWD
            - cd flutter-packages/packages/go_router/example/api
            - dart pub global run very_good_cli:very_good packages get -r
        build:
          commands:
            - echo "Building Dart Frog server"
            - dart pub global run dart_frog_cli:dart_frog build
            - echo "Compiling .exe file"
            - dart compile exe build/bin/server.dart -o build/bin/server
            - dart run build/bin/server.dart
    frontend:
      phases:
        preBuild:
          commands:
            - echo "Installing dependencies"
            - echo $PWD
            - cd flutter-packages/packages/go_router/example/
            - dart pub global run very_good_cli:very_good packages get -r
        build:
          commands:
            - echo "Building Flutter web application"
            - flutter build web -t lib/named_routes.dart --release --dart-define BASE_URL=$BASE_URL
      artifacts:
        baseDirectory: build/web
        files:
          - "**/*"
      cache:
        paths:
          - flutter/.pub-cache
